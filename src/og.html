<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social image · Load dosing</title>
<!-- Source of ../og.png (1200x630), English only. Generate: cd src && python3 render_og.py -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@500&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #0d1311; color: #e9efea; font-family: "IBM Plex Sans", sans-serif; padding: 52px 56px; display: grid; grid-template-columns: 1fr 280px; gap: 28px;
    background-image: linear-gradient(#121b18 1px, transparent 1px), linear-gradient(90deg, #121b18 1px, transparent 1px); background-size: 48px 48px; }
  .left { display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
  .kicker { font: 600 16px "JetBrains Mono", monospace; letter-spacing: 2px; text-transform: uppercase; color: #7fdcb4; }
  .kicker i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #e3a23b; margin-right: 12px; vertical-align: middle; }
  h1 { font: 700 58px/1.05 "Space Grotesk", sans-serif; letter-spacing: -1px; margin-top: 18px; }
  h1 .g { color: #34b78a; } h1 .a { color: #e3a23b; }
  .stats { display: flex; gap: 14px; }
  .stat { background: #17221e; border: 1px solid #273a33; border-radius: 16px; padding: 14px 16px; flex: 1; min-width: 0; }
  .stat b { display: block; font: 600 36px/1.1 "JetBrains Mono", monospace; }
  .stat b.a { color: #e3a23b; } .stat b.g { color: #34b78a; }
  .stat span { display: block; margin-top: 4px; font-size: 15px; line-height: 1.3; color: #a7b5ad; }
  .foot { font: 500 18px "JetBrains Mono", monospace; color: #8a998f; }
  .bars { align-self: end; display: flex; align-items: flex-end; gap: 22px; height: 440px; padding-bottom: 46px; }
  .bars div { width: 70px; border-radius: 12px; }
</style>
</head>
<body>
  <div class="left">
    <div>
      <p class="kicker"><i></i>Chronic low back pain · Saudi Arabia</p>
      <h1>A new Saudi guideline.<br><span class="g">Guidelines, dose</span><br><span class="a">and gaps.</span></h1>
    </div>
    <div class="stats">
      <div class="stat"><b class="a">52.3%</b><span>annual prevalence<br>(124 studies)</span></div>
      <div class="stat"><b class="g">239</b><span>RCTs in the 2026<br>dose meta-analysis</span></div>
      <div class="stat"><b>0</b><span>dose questions<br>in the Saudi guideline</span></div>
    </div>
    <p class="foot">dosificacion-carga.vercel.app · EN · ES · AR</p>
  </div>
  <div class="bars" aria-hidden="true">
    <div style="height:150px;background:#34b78a"></div>
    <div style="height:250px;background:#34b78a"></div>
    <div style="height:370px;background:#e3a23b"></div>
  </div>
</body>
</html>
